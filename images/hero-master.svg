<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bce2ff"/>
      <stop offset="1" stop-color="#3399ff"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <rect width="500" height="400" fill="url(#bg)"/>

  <!-- Декоративные точки -->
  <circle cx="70" cy="80" r="5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="430" cy="130" r="6" fill="#3399ff" opacity="0.35"/>
  <circle cx="400" cy="60" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="60" cy="330" r="4" fill="#1b7ff2" opacity="0.4"/>
  <circle cx="440" cy="345" r="5" fill="#f59e0b" opacity="0.4"/>

  <!-- Тень под машинкой -->
  <ellipse cx="250" cy="360" rx="130" ry="14" fill="#101828" opacity="0.08"/>

  <!-- Корпус стиральной машины -->
  <rect x="150" y="115" width="200" height="225" rx="24" fill="#ffffff" stroke="#1b7ff2" stroke-width="3"/>

  <!-- Панель управления -->
  <path d="M150 139a24 24 0 0 1 24-24h152a24 24 0 0 1 24 24v31H150z" fill="#1b7ff2"/>
  <circle cx="182" cy="144" r="6" fill="#ffffff"/>
  <circle cx="208" cy="144" r="6" fill="#ffffff" opacity="0.55"/>
  <rect x="278" y="139" width="52" height="10" rx="5" fill="#ffffff" opacity="0.85"/>

  <!-- Дверца -->
  <circle cx="250" cy="245" r="72" fill="#f6f8fb" stroke="#1468d8" stroke-width="4"/>
  <circle cx="250" cy="245" r="54" fill="url(#door)"/>
  <circle cx="250" cy="245" r="34" fill="#ffffff" opacity="0.55"/>

  <!-- Пузырьки -->
  <circle cx="228" cy="222" r="8" fill="url(#bubble)"/>
  <circle cx="268" cy="252" r="6" fill="url(#bubble)"/>
  <circle cx="244" cy="272" r="5" fill="url(#bubble)"/>
  <circle cx="272" cy="228" r="4" fill="url(#bubble)"/>

  <!-- Иконки-акценты -->
  <g transform="translate(80, 155)" stroke="#f59e0b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 14 L14 0 L28 14 L14 28 Z"/>
  </g>
  <g transform="translate(390, 210)" stroke="#10b981" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 12 L12 0 L24 12"/>
    <path d="M12 6 v14"/>
  </g>
  <g transform="translate(415, 290)" stroke="#1b7ff2" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7"/>
    <path d="M10 6 v5 l3 2"/>
  </g>
</svg>
